    <rect x="304" y="222" width="38" height="38" rx="6" transform="rotate(14 323 241)"/>
    <rect x="270" y="262" width="36" height="36" rx="6" transform="rotate(6 288 280)"/>
  </g>
  <!-- Sedotan -->
  <path d="M330 300 L372 70 h22" stroke="#a3341c" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Irisan jeruk -->
  <circle cx="212" cy="140" r="34" fill="#f2b632"/>
  <circle cx="212" cy="140" r="26" fill="#f8d77a"/>
  <g stroke="#f2b632" stroke-width="3">
    <line x1="212" y1="114" x2="212" y2="166"/>
    <line x1="186" y1="140" x2="238" y2="140"/>
    <line x1="194" y1="122" x2="230" y2="158"/>
    <line x1="230" y1="122" x2="194" y2="158"/>
  </g>
  <path d="M210 120 h180 l-2 22 h-176 Z" fill="#fffefb" opacity="0.4"/>

  <!-- Cangkir kopi -->
  <ellipse cx="560" cy="374" rx="120" ry="16" fill="#a9bbd6"/>
  <ellipse cx="560" cy="362" rx="110" ry="20" fill="#fffefb"/>
