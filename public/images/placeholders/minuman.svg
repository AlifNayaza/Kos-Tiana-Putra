  <!-- Gelas es teh / es susu -->
  <ellipse cx="300" cy="372" rx="100" ry="14" fill="#a9bbd6"/>
  <path d="M210 120 h180 l-20 250 q-2 12 -14 12 h-112 q-12 0 -14 -12 Z" fill="#fffefb" opacity="0.55"/>
  <path d="M220 190 h160 l-14 176 q-2 10 -12 10 h-108 q-10 0 -12 -10 Z" fill="#b5651d"/>
  <path d="M220 190 h160 l-3 34 h-154 Z" fill="#d38a3c"/>
