<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Ilustrasi minuman">
  <!-- Latar -->
  <rect width="800" height="450" fill="#e8eef7"/>
  <rect y="360" width="800" height="90" fill="#c9d6e8"/>
  <g fill="#d6e1f0">
    <circle cx="90" cy="80" r="30"/>
    <circle cx="720" cy="90" r="22"/>
    <circle cx="660" cy="40" r="12"/>
